<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — MEIH</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/pages/auth.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <main class="page auth-page" data-page="login">
    <div class="auth-card">
      <h1 data-i18n="auth.welcome_back">Welcome back</h1>
      <p class="auth-sub" data-i18n="auth.login_sub">Log in to manage your events, bookings, or innovation submissions.</p>

      <form id="login-form" class="stacked-form" novalidate>
        <label for="login-email" data-i18n="auth.email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="email" required />

        <label for="login-password" data-i18n="auth.password">Password</label>
        <div class="password-field">
          <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="8" />
          <button type="button" class="password-toggle" aria-label="Show password" tabindex="-1">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>

        <p id="login-error" class="form-error" role="alert" hidden></p>

        <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.login_btn">Log In</button>
      </form>

      <p class="auth-switch"><span data-i18n="auth.no_account">Don't have an account?</span> <a href="register.html" data-i18n="auth.signup_link">Register here</a></p>
    </div>
  </main>

  <div id="footer-root"></div>
  <div id="ai-root"></div>
  <script src="../js/config.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import { auth } from '../js/auth.js';
    import { isEmail } from '../js/utils/validators.js';

    var dashMap = {
      client: 'dashboard-client.html',
      planner: 'dashboard-planner.html',
      vendor: 'dashboard-vendor.html',
      innovator: 'dashboard-innovator.html',
      judge: 'dashboard-judge.html',
      admin: 'dashboard-admin.html',
      superadmin: 'dashboard-admin.html',
      public_voter: 'innovation.html',
      innovator_manager: 'dashboard-innovator-manager.html',
    };

    var loginError = document.getElementById('login-error');

    // Password visibility toggle
    document.querySelectorAll('.password-toggle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var input = btn.parentElement.querySelector('input');
        var eyeOpen = btn.querySelector('.eye-open');
        var eyeClosed = btn.querySelector('.eye-closed');
        if (input.type === 'password') {
          input.type = 'text';
          eyeOpen.style.display = 'none';
          eyeClosed.style.display = 'block';
          btn.setAttribute('aria-label', 'Hide password');
        } else {
          input.type = 'password';
          eyeOpen.style.display = 'block';
          eyeClosed.style.display = 'none';
          btn.setAttribute('aria-label', 'Show password');
        }
      });
    });

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var data = Object.fromEntries(new FormData(e.target));
      loginError.hidden = true;

      if (!isEmail(data.email)) {
        loginError.textContent = 'Please enter a valid email address.';
        loginError.hidden = false;
        return;
      }

      if (!data.password) data.password = '';

      try {
        var result = await auth.login(data.email, data.password);
        var user = result.user;
        if (!user) {
          window.location.href = 'dashboard-client.html';
        } else if (result.emailVerified === false) {
          window.location.href = 'verify-email.html';
        } else if ((user.role === 'planner' || user.role === 'vendor') && result.profileComplete === false) {
          window.location.href = 'complete-profile.html';
        } else {
          window.location.href = dashMap[user.role] || 'dashboard-client.html';
        }
      } catch (err) {
        loginError.textContent = err.message || 'Login failed. Check your credentials and try again.';
        loginError.hidden = false;
      }
    });
  </script>
</body>
</html>
