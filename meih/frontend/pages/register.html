<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — MEIH</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/pages/auth.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <main class="page auth-page" data-page="register">
    <div class="auth-card">
      <h1 data-i18n="auth.create_account">Create your account</h1>
      <p class="auth-sub" data-i18n="auth.join_sub">Join the Event Hub or Innovation Hub — one account, multiple roles.</p>

      <form id="register-form" class="stacked-form" novalidate>
        <div class="form-group">
          <label for="reg-role" data-i18n="auth.role_label">I am joining as a...</label>
          <select id="reg-role" name="role" required>
            <option value="client" data-i18n="auth.role_client">Event Client</option>
            <option value="planner" data-i18n="auth.role_planner">Event Planner</option>
            <option value="vendor" data-i18n="auth.role_vendor">Vendor</option>
            <option value="innovator" data-i18n="auth.role_innovator">Innovator</option>
            <option value="public_voter" data-i18n="auth.role_voter">Public Voter</option>
          </select>
        </div>

        <div class="role-description" id="role-description">
          <p id="role-desc-text"></p>
        </div>

        <div>
          <label for="reg-fullname" data-i18n="auth.fullname">Full name</label>
          <input id="reg-fullname" name="fullName" type="text" required data-i18n-ph="auth.fullname_ph" placeholder="e.g. John Mwakasege" />
        </div>

        <div>
          <label for="reg-email" data-i18n="auth.email">Email</label>
          <input id="reg-email" name="email" type="email" required data-i18n-ph="auth.email_ph" placeholder="you@example.com" />
        </div>

        <div>
          <label for="reg-password" data-i18n="auth.password">Password</label>
          <input id="reg-password" name="password" type="password" minlength="8" required data-i18n-ph="auth.password_ph" placeholder="Min. 8 characters" />
        </div>

        <div>
          <label for="reg-password-confirm" data-i18n="auth.password_confirm">Confirm password</label>
          <input id="reg-password-confirm" name="passwordConfirm" type="password" minlength="8" required />
        </div>

        <label class="checkbox-label">
          <input type="checkbox" name="acceptTerms" required />
          <span data-i18n="auth.terms">I agree to the Terms of Service and Privacy Policy.</span>
        </label>

        <p id="register-error" class="form-error" role="alert" hidden></p>

        <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.create_btn">Create Account</button>
      </form>

      <p class="auth-switch"><span data-i18n="auth.has_account">Already have an account?</span> <a href="login.html" data-i18n="auth.login_link">Log in</a></p>
    </div>
  </main>

  <div id="footer-root"></div>
  <div id="ai-root"></div>
  <script src="../js/config.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import { auth } from '../js/auth.js';
    import { isEmail, minLength } from '../js/utils/validators.js';

    var DISPOSABLE_DOMAINS = [
      'tempmail.com', 'throwaway.email', 'guerrillamail.com', 'temp-mail.org',
      'fakeinbox.com', 'sharklasers.com', 'dispostable.com', 'yopmail.com',
      'mailinator.com', 'maildrop.cc', '10minutemail.com', 'trashmail.com',
      'discard.email', 'mailnesia.com', 'getnada.com', 'emailondeck.com',
      'tempail.com', 'tmpmail.net', 'mohmal.com', 'discardmail.com',
      'spambox.us', 'mailnull.com', 'mailsac.com', 'harakirimail.com',
      'binkmail.com', 'bobmail.info', 'letthemeatspam.com', 'pookmail.com',
    ];

    var DISPOSABLE_TLDS = ['tk', 'ml', 'ga', 'cf', 'gq'];

    function validateEmailStrict(email) {
      if (!isEmail(email)) return { valid: false, error: 'Please enter a valid email address.' };
      var parts = email.toLowerCase().split('@');
      var domain = parts[1] || '';
      if (DISPOSABLE_DOMAINS.indexOf(domain) !== -1) {
        return { valid: false, error: 'Disposable email addresses are not allowed. Please use a permanent email.' };
      }
      var tld = domain.split('.').pop();
      if (DISPOSABLE_TLDS.indexOf(tld) !== -1) {
        return { valid: false, error: 'Email domains from this TLD are not allowed.' };
      }
      return { valid: true };
    }

    var roleSelect = document.getElementById('reg-role');

    var roleDescriptions = {
      client: 'Create events, compare vendors, pay deposits, and track your event progress.',
      planner: 'Manage events, build your portfolio, connect with vendors, and grow your business.',
      vendor: 'Showcase your services, receive bookings, and get paid for your work.',
      innovator: 'Submit your innovations, compete in challenges, and win recognition.',
      public_voter: 'Browse innovations, vote for your favorites, and support local ideas.',
    };

    function updateRoleDescription() {
      document.getElementById('role-desc-text').textContent = roleDescriptions[roleSelect.value] || '';
    }

    roleSelect.addEventListener('change', updateRoleDescription);
    updateRoleDescription();

    var errorEl = document.getElementById('register-error');

    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      errorEl.hidden = true;
      var data = Object.fromEntries(new FormData(e.target));

      var emailCheck = validateEmailStrict(data.email);
      if (!emailCheck.valid) return showError(emailCheck.error);
      if (!minLength(data.password, 8)) return showError('Password must be at least 8 characters.');
      if (data.password !== data.passwordConfirm) return showError('Passwords do not match.');
      if (!data.acceptTerms) return showError('Please accept the Terms of Service.');

      delete data.passwordConfirm;
      delete data.acceptTerms;

      try {
        var result = await auth.register(data);
        if (result.emailVerificationRequired) {
          window.location.href = 'verify-email.html';
        } else {
          window.location.href = 'login.html?registered=1';
        }
      } catch (err) {
        showError(err.message || 'Registration failed. Please try again.');
      }
    });

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.hidden = false;
    }
  </script>
</body>
</html>
