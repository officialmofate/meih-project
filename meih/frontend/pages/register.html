<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — MEIH</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/pages/auth.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <main class="page auth-page" data-page="register">
    <div class="auth-card auth-card-wide">
      <h1 data-i18n="auth.create_account">Create your account</h1>
      <p class="auth-sub" data-i18n="auth.join_sub">Join the Event Hub or Innovation Hub — one account, multiple roles.</p>

      <form id="register-form" class="stacked-form" novalidate>
        <div class="form-group">
          <label for="reg-role" data-i18n="auth.role_label">I am joining as a...</label>
          <select id="reg-role" name="role" required>
            <option value="client" data-i18n="auth.role_client">Event Client</option>
            <option value="planner" data-i18n="auth.role_planner">Event Planner</option>
            <option value="vendor" data-i18n="auth.role_vendor">Vendor</option>
            <option value="innovator" data-i18n="auth.role_innovator">Innovator</option>
            <option value="public_voter" data-i18n="auth.role_voter">Public Voter</option>
          </select>
        </div>

        <div class="role-description" id="role-description">
          <p id="role-desc-text"></p>
        </div>

        <div>
          <label for="reg-fullname" data-i18n="auth.fullname">Full name</label>
          <input id="reg-fullname" name="fullName" type="text" required data-i18n-ph="auth.fullname_ph" placeholder="e.g. John Mwakasege" />
        </div>

        <div>
          <label for="reg-email" data-i18n="auth.email">Email</label>
          <input id="reg-email" name="email" type="email" required data-i18n-ph="auth.email_ph" placeholder="you@example.com" />
        </div>

        <div>
          <label for="reg-phone" data-i18n="auth.phone">Phone number</label>
          <input id="reg-phone" name="phone" type="tel" data-i18n-ph="auth.phone_ph" placeholder="e.g. +255 754 123 456" />
        </div>

        <div>
          <label for="reg-password" data-i18n="auth.password">Password</label>
          <input id="reg-password" name="password" type="password" minlength="8" required data-i18n-ph="auth.password_ph" placeholder="Min. 8 characters" />
        </div>

        <div>
          <label for="reg-password-confirm" data-i18n="auth.password_confirm">Confirm password</label>
          <input id="reg-password-confirm" name="passwordConfirm" type="password" minlength="8" required />
        </div>

        <!-- Client fields -->
        <div id="client-fields" class="role-fields" hidden>
        </div>

        <!-- Planner fields -->
        <div id="planner-fields" class="role-fields" hidden>
          <div class="role-fields-header" data-i18n="auth.planner_details">Planner Details</div>
          <div>
            <label for="reg-company" data-i18n="auth.company">Company / business name</label>
            <input id="reg-company" name="businessName" type="text" data-i18n-ph="auth.company_ph" placeholder="e.g. Top Events Co." />
          </div>
          <div>
            <label for="reg-planner-bio" data-i18n="auth.about_services">About your services</label>
            <textarea id="reg-planner-bio" name="bio" rows="3" data-i18n-ph="auth.about_services_ph" placeholder="Describe your event planning services..."></textarea>
          </div>
        </div>

        <!-- Vendor fields -->
        <div id="vendor-fields" class="role-fields" hidden>
          <div class="role-fields-header" data-i18n="auth.business_details">Business Details</div>
          <div>
            <label for="reg-business-name" data-i18n="auth.business_name">Business name</label>
            <input id="reg-business-name" name="businessName" type="text" data-i18n-ph="auth.business_name_ph" placeholder="e.g. Dodoma Grand Catering" />
          </div>
          <div>
            <label for="reg-vendor-category" data-i18n="auth.service_category">Service category</label>
            <select id="reg-vendor-category" name="category">
              <option value="" data-i18n="auth.select_category">Select a category</option>
            </select>
          </div>
          <div>
            <label for="reg-starting-price" data-i18n="auth.starting_price">Starting price (Tsh)</label>
            <input id="reg-starting-price" name="startingPrice" type="number" min="0" data-i18n-ph="auth.starting_price_ph" placeholder="e.g. 500000" />
          </div>
          <div>
            <label for="reg-vendor-bio" data-i18n="auth.about_business">About your business</label>
            <textarea id="reg-vendor-bio" name="bio" rows="3" data-i18n-ph="auth.about_business_ph" placeholder="Describe your services and expertise..."></textarea>
          </div>
        </div>

        <!-- Innovator fields -->
        <div id="innovator-fields" class="role-fields" hidden>
          <div class="role-fields-header" data-i18n="auth.innovator_profile">Innovator Profile</div>
          <div>
            <label for="reg-organization" data-i18n="auth.organization">Organization / affiliation</label>
            <input id="reg-organization" name="organization" type="text" data-i18n-ph="auth.organization_ph" placeholder="e.g. University of Dar es Salaam" />
          </div>
        </div>

        <!-- Voter fields -->
        <div id="voter-fields" class="role-fields" hidden>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" name="acceptTerms" required />
          <span data-i18n="auth.terms">I agree to the Terms of Service and Privacy Policy.</span>
        </label>

        <p id="register-error" class="form-error" role="alert" hidden></p>

        <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.create_btn">Create Account</button>
      </form>

      <p class="auth-switch"><span data-i18n="auth.has_account">Already have an account?</span> <a href="login.html" data-i18n="auth.login_link">Log in</a></p>
    </div>
  </main>

  <div id="footer-root"></div>
  <div id="ai-root"></div>
  <script src="../js/config.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import { auth } from '../js/auth.js';
    import { api } from '../js/api.js';
    import { isEmail, minLength } from '../js/utils/validators.js';

    var roleSelect = document.getElementById('reg-role');
    var roleFields = {
      client: document.getElementById('client-fields'),
      planner: document.getElementById('planner-fields'),
      vendor: document.getElementById('vendor-fields'),
      innovator: document.getElementById('innovator-fields'),
      public_voter: document.getElementById('voter-fields'),
    };

    var roleDescriptions = {
      client: 'Create events, compare vendors, pay deposits, and track your event progress.',
      planner: 'Manage events, build your portfolio, connect with vendors, and grow your business.',
      vendor: 'Showcase your services, receive bookings, and get paid for your work.',
      innovator: 'Submit your innovations, compete in challenges, and win recognition.',
      public_voter: 'Browse innovations, vote for your favorites, and support local ideas.',
    };

    function toggleRoleFields() {
      var role = roleSelect.value;
      Object.keys(roleFields).forEach(function(r) {
        roleFields[r].hidden = r !== role;
      });
      document.getElementById('role-desc-text').textContent = roleDescriptions[role] || '';
    }

    roleSelect.addEventListener('change', toggleRoleFields);
    toggleRoleFields();

    // Load vendor categories
    (async function() {
      try {
        var cats = await api.get('/vendors/categories');
        var select = document.getElementById('reg-vendor-category');
        if (Array.isArray(cats) && cats.length) {
          cats.forEach(function(cat) {
            var opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            select.appendChild(opt);
          });
        }
      } catch {
        // Fallback categories if API unavailable
        var fallback = [
          'Decorator', 'MC', 'Photographer', 'Videographer', 'Sound Engineer',
          'Catering', 'Florist', 'Security', 'Transport', 'Accommodation',
          'Printing', 'Branding', 'Lighting', 'Tent & Furniture', 'Makeup',
          'Entertainment', 'Drone Services'
        ];
        var select = document.getElementById('reg-vendor-category');
        fallback.forEach(function(cat) {
          var opt = document.createElement('option');
          opt.value = cat;
          opt.textContent = cat;
          select.appendChild(opt);
        });
      }
    })();

    var errorEl = document.getElementById('register-error');

    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      errorEl.hidden = true;
      var data = Object.fromEntries(new FormData(e.target));

      if (!isEmail(data.email)) return showError('Please enter a valid email address.');
      if (!minLength(data.password, 8)) return showError('Password must be at least 8 characters.');
      if (data.password !== data.passwordConfirm) return showError('Passwords do not match.');
      if (!data.acceptTerms) return showError('Please accept the Terms of Service.');

      var role = data.role;

      if (role === 'planner') {
        if (!data.businessName || !data.businessName.trim()) return showError('Please enter your company name.');
      } else if (role === 'vendor') {
        if (!data.businessName || !data.businessName.trim()) return showError('Please enter your business name.');
        if (!data.category) return showError('Please select a service category.');
      }

      // Strip fields that don't belong to this role
      delete data.passwordConfirm;
      delete data.acceptTerms;
      if (role !== 'vendor' && role !== 'planner') {
        delete data.businessName;
        delete data.bio;
      }
      if (role !== 'vendor') {
        delete data.category;
        delete data.startingPrice;
      }
      if (role !== 'innovator') {
        delete data.organization;
      }
      if (!data.phone) delete data.phone;

      try {
        await auth.register(data);
        window.location.href = 'login.html?registered=1';
      } catch (err) {
        showError(err.message || 'Registration failed. Please try again.');
      }
    });

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.hidden = false;
    }
  </script>
</body>
</html>
