<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendors — MEIH</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/pages/events.css" />
  <style>
    .vendors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-lg);
    }
    .vendor-card {
      text-align: center;
      padding: var(--space-xl) var(--space-lg);
      transition: all var(--transition-normal);
      cursor: pointer;
    }
    .vendor-card:hover {
      transform: translateY(-4px);
      border-color: rgba(108, 92, 231, 0.3);
      box-shadow: 0 12px 40px rgba(108, 92, 231, 0.15);
    }
    .vendor-card-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6c5ce7, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-md);
      overflow: hidden;
    }
    .vendor-card-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .vendor-card-avatar span {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
    }
    .vendor-card-body h3 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .vendor-card-category {
      font-size: 13px;
      color: var(--color-text-muted);
      margin-bottom: var(--space-sm);
    }
    .vendor-card-bio {
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.5;
      margin-bottom: var(--space-md);
    }
    .vendor-card-rating {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
    }
    .vendor-card-rating .stars {
      color: #f9ca24;
      font-size: 14px;
      letter-spacing: 1px;
    }
    .vendor-card-rating .rating-num {
      font-size: 13px;
      color: var(--color-text-muted);
    }

    @media (max-width: 600px) {
      .vendors-grid { grid-template-columns: 1fr; }
      .vendor-card { padding: var(--space-lg); }
    }
  </style>
</head>
<body>
  <div id="navbar-root"></div>

  <main class="page" data-page="vendors">
    <div class="container">

      <header class="page-header">
        <h1>Vendors</h1>
        <p>Browse professional event vendors across Tanzania. View their profiles, portfolios, and ratings.</p>
      </header>

      <div class="filter-bar card">
        <input id="search-input" type="search" placeholder="Search vendors by name or business..." aria-label="Search vendors" />
        <select id="category-filter">
          <option value="">All Categories</option>
        </select>
      </div>

      <p id="results-count" class="results-count"></p>

      <div id="vendors-grid" class="vendors-grid" aria-live="polite"></div>
      <p id="empty-state" class="empty-state" hidden>No vendors found. Try broadening your search.</p>

    </div>
  </main>

  <div id="footer-root"></div>
  <div id="ai-root"></div>
  <script src="../js/config.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import { api } from '../js/api.js';
    import { debounce } from '../js/utils/helpers.js';

    let vendors = [];
    let filtered = [];
    const categories = [];

    const grid = document.getElementById('vendors-grid');
    const emptyState = document.getElementById('empty-state');
    const resultsCount = document.getElementById('results-count');
    const categoryFilter = document.getElementById('category-filter');

    function render() {
      grid.innerHTML = filtered.map(v => {
        const name = v.business_name || v.full_name || 'Vendor';
        const category = v.category || '';
        const rating = v.rating || 0;
        const stars = '★'.repeat(Math.round(rating)) + '☆'.repeat(5 - Math.round(rating));
        const bio = v.bio || 'No description provided.';
        const imageUrl = v.image_url || '';

        return `
          <div class="card vendor-card" data-id="${v.id}">
            <div class="vendor-card-avatar">
              ${imageUrl ? `<img src="${window.resolveUrl(imageUrl)}" alt="${name}" />` : `<span>${name.charAt(0).toUpperCase()}</span>`}
            </div>
            <div class="vendor-card-body">
              <h3>${name}</h3>
              <p class="vendor-card-category">${category}</p>
              <p class="vendor-card-bio">${bio.length > 100 ? bio.substring(0, 100) + '...' : bio}</p>
              <div class="vendor-card-rating">
                <span class="stars">${stars}</span>
                <span class="rating-num">${rating > 0 ? rating.toFixed(1) : 'No ratings'}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      grid.querySelectorAll('.vendor-card').forEach((card) => {
        card.addEventListener('click', () => {
          window.location.href = `vendor-detail.html?id=${card.dataset.id}`;
        });
      });

      emptyState.hidden = filtered.length !== 0;
      resultsCount.textContent = `${filtered.length} vendor${filtered.length === 1 ? '' : 's'} found`;
    }

    function applyFilters() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const cat = categoryFilter.value;
      filtered = vendors.filter(v =>
        (!q || (v.business_name || '').toLowerCase().includes(q) || (v.full_name || '').toLowerCase().includes(q)) &&
        (!cat || v.category === cat)
      );
      render();
    }

    document.getElementById('search-input').addEventListener('input', debounce(applyFilters, 250));
    categoryFilter.addEventListener('change', applyFilters);

    grid.innerHTML = '<p class="results-count">Loading vendors...</p>';

    Promise.all([
      api.get('/vendors').catch(() => []),
      api.get('/vendors/categories').catch(() => []),
    ]).then(([vendorData, cats]) => {
      if (Array.isArray(vendorData)) vendors = vendorData;
      if (Array.isArray(cats)) {
        cats.forEach(c => {
          const name = typeof c === 'string' ? c : c.name;
          if (name) {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            categoryFilter.appendChild(opt);
          }
        });
      }
    }).catch(() => {}).finally(() => applyFilters());
  </script>
</body>
</html>
