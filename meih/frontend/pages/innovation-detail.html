<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="View innovation details, scores, and vote. Support innovators in Tanzania." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://mofate.online/pages/innovation-detail.html" />
  <meta property="og:title" content="Innovation Detail — MEIH" />
  <meta property="og:description" content="View innovation details, scores, and vote. Support innovators in Tanzania." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mofate.online/pages/innovation-detail.html" />
  <meta property="og:image" content="https://mofate.online/favicon.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Innovation Detail — MEIH" />
  <meta name="twitter:description" content="View innovation details, scores, and vote. Support innovators in Tanzania." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Innovation Detail — MEIH</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/pages/innovation.css" />
  <script src="../js/seo.js"></script>
</head>
<body>
  <div id="navbar-root"></div>

  <main class="page" data-page="innovation-detail">
    <div class="container detail-layout">

      <section class="detail-main">
        <nav class="breadcrumb"><a href="innovation.html">&larr; Back to Innovation Hub</a></nav>

        <h1 id="inn-title" data-i18n="loading_innovation">Loading innovation...</h1>
        <div class="flex meta-row">
          <span id="inn-team">—</span>
          <span id="inn-theme">—</span>
        </div>

        <img id="inn-supportive-image" hidden style="max-width:100%;max-height:360px;border-radius:12px;border:1px solid var(--color-border);object-fit:contain;background:var(--color-surface-raised,#fff);margin:var(--space-md) 0;" alt="Innovation supporting material" />
        <p id="inn-supportive-empty" hidden style="max-width:100%;border:1px dashed var(--color-border);border-radius:12px;padding:16px;color:var(--color-muted,#888);text-align:center;margin:var(--space-md) 0;">No supporting material uploaded.</p>

        <section class="card">
          <h2 data-i18n="introduction">Introduction</h2>
          <p id="inn-problem">—</p>
          <h2 data-i18n="methodology">Methodology</h2>
          <p id="inn-description">—</p>
          <h2 data-i18n="results">Results</h2>
          <p id="inn-solution">—</p>
          <h2 data-i18n="expected_outcomes">Expected Outcomes</h2>
          <p id="inn-impact">—</p>
          <dl class="detail-grid">
            <dt data-i18n="technology">Technology</dt><dd id="inn-technology">—</dd>
            <dt data-i18n="presentation_mode">Presentation mode</dt><dd id="inn-mode">—</dd>
          </dl>
        </section>

        <section class="card">
          <h2 data-i18n="comments">Comments</h2>
          <ul id="comment-list" class="comment-list">
            <li class="results-count" data-i18n="no_comments_yet">No comments yet.</li>
          </ul>
          <form id="comment-form" class="flex">
            <input type="text" name="comment" data-i18n-placeholder="leave_comment" placeholder="Leave a comment..." required />
            <button type="submit" class="btn btn-secondary" data-i18n="post">Post</button>
          </form>
        </section>
      </section>

      <aside class="detail-sidebar">
        <div class="card sticky-card vote-card">
          <h2 data-i18n="support_innovation">Support This Innovation</h2>
          <p class="vote-count"><span id="vote-count">0</span> <span data-i18n="votes">votes</span></p>
          <button id="vote-btn" class="btn btn-primary btn-block" data-i18n="vote_otp">Vote (OTP verified)</button>
          <p id="vote-confirmation" class="form-success" hidden data-i18n="thanks_voting">Thanks for voting!</p>
          <p id="vote-error" class="form-error" hidden></p>

          <div id="otp-vote-panel" class="stacked-form" hidden>
            <label for="vote-otp" data-i18n="enter_otp">Enter your 6-digit Public Voter OTP</label>
            <input id="vote-otp" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
            <button id="confirm-vote-btn" class="btn btn-primary btn-block" data-i18n="confirm_vote">Confirm Vote</button>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <div id="footer-root"></div>
  <div id="ai-root"></div>
  <script src="../js/config.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import { api, showLoading, hideLoading } from '../js/api.js';

    const params = new URLSearchParams(window.location.search);
    const innId = params.get('id');
    if (!innId) {
      document.querySelector('.detail-main').innerHTML = '<p class="empty-state">No innovation specified.</p>';
      throw new Error('No innovation ID');
    }

    function paint(inn) {
      document.getElementById('inn-title').textContent = inn.title || 'Untitled';
      document.getElementById('inn-team').textContent = inn.team || '—';
      document.getElementById('inn-problem').textContent = inn.problem || '—';
      document.getElementById('inn-description').textContent = inn.description || '—';
      document.getElementById('inn-solution').textContent = inn.solution || '—';
      document.getElementById('inn-impact').textContent = inn.impact || '—';
      document.getElementById('inn-technology').textContent = inn.technology || '—';
      document.getElementById('inn-mode').textContent = inn.presentationMode || inn.presentation_mode || '—';
      document.getElementById('vote-count').textContent = inn.voteCount || inn.vote_count || 0;
      if (typeof initPageMeta === 'function') initPageMeta({
        title: (inn.title || 'Innovation') + ' — MEIH',
        description: (inn.problem || inn.solution || '').substring(0, 150),
        image: inn.image_url ? window.resolveUrl(inn.image_url) : '',
        url: window.location.href
      });

      const img = document.getElementById('inn-supportive-image');
      const imgEmpty = document.getElementById('inn-supportive-empty');
      if (img) {
        if (inn.image_base64 || inn.image_url) {
          if (inn.image_base64) {
            const ext = (inn.image_url || '.png').split('.').pop().toLowerCase();
            const mime = ext === 'jpg' || ext === 'jpeg' ? 'image/jpeg' : ext === 'gif' ? 'image/gif' : ext === 'webp' ? 'image/webp' : 'image/png';
            img.src = 'data:' + mime + ';base64,' + inn.image_base64;
          } else {
            img.src = window.resolveUrl(inn.image_url);
          }
          img.hidden = false;
          if (imgEmpty) imgEmpty.hidden = true;
        } else if (imgEmpty) {
          img.hidden = true;
          imgEmpty.hidden = false;
        }
      }
      const themeEl = document.getElementById('inn-theme');
      if (themeEl) themeEl.textContent = [inn.main_theme, inn.sub_theme].filter(Boolean).join(' · ') || '—';
    }

    api.get(`/innovation/submissions/${innId}`).then(paint).catch(() => {
      document.querySelector('.detail-main').innerHTML = '<p class="empty-state">Innovation not found.</p>';
    });

    // Load comments
    api.get(`/innovation/submissions/${innId}/comments`).then((comments) => {
      const list = document.getElementById('comment-list');
      if (Array.isArray(comments) && comments.length) {
        list.innerHTML = comments.map(c => `<li><strong>${c.author_name || 'Anonymous'}</strong> — ${c.comment || c.text || ''}</li>`).join('');
      }
    }).catch(() => {});

    const voteBtn = document.getElementById('vote-btn');
    const otpPanel = document.getElementById('otp-vote-panel');
    const voteError = document.getElementById('vote-error');

    function showVoteError(msg) {
      voteError.textContent = msg;
      voteError.hidden = false;
    }

    const currentUser = (() => {
      try { return JSON.parse(localStorage.getItem('meih_user') || 'null'); } catch (e) { return null; }
    })();

    if (currentUser && currentUser.role && currentUser.role !== 'public_voter') {
      voteBtn.disabled = true;
      voteBtn.textContent = 'Only Public Voters can vote';
      showVoteError('You must register as a Public Voter to vote.');
    }

    voteBtn.addEventListener('click', () => {
      voteError.hidden = true;
      if (!currentUser) {
        showVoteError('Please <a href="login.html">log in</a> as a Public Voter to vote.');
        return;
      }
      voteBtn.hidden = true;
      otpPanel.hidden = false;
      document.getElementById('vote-otp').focus();
    });

    document.getElementById('confirm-vote-btn').addEventListener('click', async () => {
      const btn = document.getElementById('confirm-vote-btn');
      showLoading(btn);
      voteError.hidden = true;
      const otp = document.getElementById('vote-otp').value.trim();
      if (!/^\d{6}$/.test(otp)) {
        hideLoading(btn);
        showVoteError('Please enter the 6-digit OTP shown on your Public Voter dashboard.');
        return;
      }
      try {
        const result = await api.post(`/innovation/submissions/${innId}/vote`, { otp });
        const countEl = document.getElementById('vote-count');
        if (result && typeof result.voteCount === 'number') {
          countEl.textContent = result.voteCount;
        } else {
          countEl.textContent = Number(countEl.textContent) + 1;
        }
        otpPanel.hidden = true;
        document.getElementById('vote-confirmation').hidden = false;
      } catch (err) {
        showVoteError(err.message || 'Voting failed. Please try again.');
        hideLoading(btn);
        return;
      }
      hideLoading(btn);
    });

    document.getElementById('comment-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const comment = new FormData(e.target).get('comment');
      const li = document.createElement('li');
      li.innerHTML = `<strong>You</strong> — ${comment}`;
      document.getElementById('comment-list').appendChild(li);
      e.target.reset();
    });
  </script>
</body>
</html>
