<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email — MEIH</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/pages/auth.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <main class="page auth-page" data-page="verify-email">
    <div class="auth-card">
      <h1>Verify Your Email</h1>
      <p class="auth-sub">Enter the 6-digit code sent to your email address.</p>

      <form id="verify-form" class="stacked-form" novalidate>
        <div>
          <label for="verify-otp">Verification Code</label>
          <input id="verify-otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="000000" autocomplete="one-time-code" style="text-align:center;font-size:24px;letter-spacing:8px;" />
        </div>

        <input type="hidden" id="verify-user-id" name="userId" />

        <p id="verify-error" class="form-error" role="alert" hidden></p>
        <p id="verify-success" class="form-success" hidden></p>

        <button type="submit" class="btn btn-primary btn-block">Verify Email</button>
      </form>

      <p class="auth-switch" style="margin-top:16px;">
        Didn't receive the code? <button id="resend-btn" class="btn-link" style="background:none;border:none;color:var(--color-primary);cursor:pointer;text-decoration:underline;">Resend</button>
      </p>

      <p class="auth-switch" style="margin-top:8px;">
        <a href="login.html">Back to Login</a>
      </p>
    </div>
  </main>

  <div id="footer-root"></div>
  <div id="ai-root"></div>
  <script src="../js/config.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import { api } from '../js/api.js';

    const params = new URLSearchParams(window.location.search);
    const tokenParam = params.get('token');
    const errorEl = document.getElementById('verify-error');
    const successEl = document.getElementById('verify-success');
    const userIdInput = document.getElementById('verify-user-id');

    let currentUserId = null;
    try {
      const raw = localStorage.getItem('meih_user');
      if (raw) {
        const user = JSON.parse(raw);
        currentUserId = user.id;
        if (user.email_verified) {
          successEl.textContent = 'Your email is already verified. You can log in.';
          successEl.hidden = false;
          document.getElementById('verify-form').hidden = true;
        }
      }
    } catch {}

    if (tokenParam) {
      document.getElementById('verify-otp').closest('div').hidden = true;
      verifyWithToken(tokenParam);
    } else if (!currentUserId) {
      document.getElementById('verify-otp').closest('div').hidden = true;
      document.getElementById('verify-form').hidden = true;
      errorEl.textContent = 'No pending verification found. Please log in first.';
      errorEl.hidden = false;
    }

    async function verifyWithToken(token) {
      try {
        await api.post('/auth/verify-email', { token });
        successEl.textContent = 'Email verified successfully! You can now log in.';
        successEl.hidden = false;
        errorEl.hidden = true;
      } catch (err) {
        errorEl.textContent = err.message || 'Verification failed.';
        errorEl.hidden = false;
        successEl.hidden = true;
      }
    }

    document.getElementById('verify-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      successEl.hidden = true;

      const otp = document.getElementById('verify-otp').value.trim();
      if (!otp || otp.length !== 6 || !/^\d{6}$/.test(otp)) {
        errorEl.textContent = 'Please enter a valid 6-digit code.';
        errorEl.hidden = false;
        return;
      }

      try {
        await api.post('/auth/verify-email', { otp, userId: currentUserId });
        successEl.textContent = 'Email verified successfully! You can now log in.';
        successEl.hidden = false;
        errorEl.hidden = true;
        try {
          const raw = localStorage.getItem('meih_user');
          if (raw) {
            const user = JSON.parse(raw);
            user.email_verified = true;
            localStorage.setItem('meih_user', JSON.stringify(user));
          }
        } catch {}
      } catch (err) {
        errorEl.textContent = err.message || 'Verification failed. Please try again.';
        errorEl.hidden = false;
      }
    });

    document.getElementById('resend-btn').addEventListener('click', async () => {
      errorEl.hidden = true;
      successEl.hidden = true;
      const email = prompt('Enter your email address to resend the verification code:');
      if (!email) return;
      try {
        await api.post('/auth/resend-verification', { email });
        successEl.textContent = 'Verification code resent. Check your inbox.';
        successEl.hidden = false;
      } catch (err) {
        errorEl.textContent = err.message || 'Failed to resend.';
        errorEl.hidden = false;
      }
    });
  </script>
</body>
</html>
